# XcodeGen fallback. Only needed if Xcode cannot open the checked-in PetPulse.xcodeproj:
#   brew install xcodegen && xcodegen generate
name: PetPulse
options:
  bundleIdPrefix: com.petpulse
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
targets:
  PetPulse:
    type: application
    platform: iOS
    sources: [PetPulse]
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petpulse.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PetPulse
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PetPulse listens while you describe your pet's day, and turns it into a check-in on this device."
        WHISPER_MODEL: ""
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
  PetPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PetPulseTests]
    dependencies:
      - target: PetPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petpulse.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PetPulse:
    build:
      targets:
        PetPulse: all
    test:
      targets: [PetPulseTests]
